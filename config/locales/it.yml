  oauth_self_registration_by_domain: Attivazione automatica solo per i domini email elencati
  oauth_self_registration_domains: Domini consentiti (separati da virgola)
  oauth_self_registration_domains_info: |
    Gli utenti con indirizzo email in uno di questi domini (o in un sottodominio) vengono attivati automaticamente.
    Tutti gli altri nuovi utenti restano in attesa dell'approvazione di un amministratore. Esempio: example.com, partner.org
  oauth_hide_login_form: Nascondi il modulo di accesso
  oauth_update_login_info: Aggiorna il profilo dell'utente dopo un accesso riuscito.
  oauth_logout: Logout OAuth
  oauth_logout_info: Esegui il logout anche dal provider OAuth dopo il logout da Redmine.
  oauth_login: Login OAuth
  oauth_login_info: Consenti agli utenti di accedere automaticamente tramite il provider OAuth, saltando il modulo di accesso.
  oauth_custom_logout_endpoint_info: Endpoint di logout dell'applicazione.
  oauth_validate_user_roles_info: "Chiave del token in cui sono presenti i ruoli dell'utente. Se impostata, il ruolo 'user'
    consente l'accesso e il ruolo 'admin' concede i diritti di amministratore. Se il ruolo 'user' non è presente, l'accesso
    viene negato. Se manca il ruolo 'admin', i diritti di amministratore vengono revocati. Es.: inserisci
    'resource_access.redmine.roles' se il token è impostato così:
    'resource_access': { 'redmine': { 'roles': ['user', 'admin'] } }"
  oauth_autologin: Accesso automatico con il provider OAuth
  oauth_version_info: Versione dell'endpoint
  oauth_enable_group_roles_info: |
    Se abilitato, tutti i ruoli aggiuntivi oltre a quelli predefiniti (admin, user) vengono associati a un gruppo con lo
    stesso nome. Ad esempio, se crei un gruppo chiamato 'developer' e il tuo utente ha un ruolo chiamato 'developer',
    l'utente verrà aggiunto a quel gruppo.

    Con questa opzione abilitata, gli utenti vengono rimossi da qualsiasi gruppo che non corrisponda ai loro ruoli: se
    aggiungi manualmente un utente al gruppo 'developer' ma l'utente non ha quel ruolo nel tuo identity provider,
    verrà rimosso dal gruppo.
  oauth_only_login: Accesso solo tramite OAuth
  oauth_only_login_info: |
    Se abilitato, gli utenti vengono reindirizzati direttamente al provider OAuth, saltando del tutto la pagina di accesso
    standard. È comunque possibile forzare la pagina di accesso standard aggiungendo il parametro 'nosso' all'URL di
    accesso, es. '/login?nosso'.
  identify_user_by_info: Campo del provider con cui identificare l'utente in Redmine
  oauth_identify_user_by_uid_info: "uid: ID utente immutabile del provider (Azure AD: oid; GitHub, GitLab: id; altri: sub). Non cambia se cambiano email o login."
  field_auto_link_user: "Collega gli utenti esistenti tramite email"
  oauth_auto_link_user_info: "Se gli utenti sono identificati tramite uid, al primo accesso OAuth un utente esistente con la stessa email viene collegato automaticamente. Abilitare solo se il provider verifica gli indirizzi email."
  oauth_no_uid: "Il provider OAuth non ha restituito l'ID utente (uid)."

