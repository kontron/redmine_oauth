  oauth_self_registration_domains_info: |
    Les utilisateur·trices dont l'email provient de l'un de ces (sous-)domaines sont activés automatiquement.
    Tous les autres nouveaux·elles utilisateur·trices sont créés en attente d'approbation par un·e administrateur·trice. Exemple: exemple.com, partenaire.org
  oauth_hide_login_form: Masquer le formulaire de connexion
  oauth_update_login_info: Mettre à jour le profil de l'utilisateur·trice après une connexion réussie.
  oauth_logout: Déconnexion OAuth
  oauth_logout_info: Déconnecter le compte auprès du fournisseur OAuth après une déconnexion de Redmine.
  oauth_login: Connexion OAuth
  oauth_login_info: Autoriser les utilisateur·trices à se connecter automatiquement via le fournisseur Oauth, esquivant le formulaire de connexion.
  oauth_custom_logout_endpoint_info: Application Logout endpoint.
  oauth_validate_user_roles_info: "Une clé du jeton qui stocke les rôles utilisateur·trice. Si présent, le rôle 'user' attribue le droit d'accès, 
    le rôle 'admin' attribue les droits d'admin. Si le rôle 'user' n'est pas présent, l'accès est refusé. Si le rôle 'admin' est manquant, les droits 
    d'administration sont révoqués. Ex.: Renseigner 'resource_access.redmine.roles', si votre jeton contient la structure suivante :
    'resource_access': { 'redmine': { 'roles': ['user', 'admin'] } }"
  oauth_autologin: Connexion automatique avec OAuth
  oauth_version_info: Endpoint version
  oauth_enable_group_roles_info: |
    Lorsqu'activé, tout rôle additionnel aux rôles par défaut (admin, user) sera traduit en un groupe du même nom.
    Ainsi, si vous créez un groupe nommé 'developer' et que votre utilisateur·trice possède un rôle nommé 'developer',
    iel sera ajouté·e à ce groupe.

    Les utilisateur·trices seront retirés de tout groupe qui ne fait pas partie de leurs rôles si cette option est activée.
    Ainsi, si vous avez manuellement ajouté un·e utilisateur·trice au groupe 'developer' mais qu'iel ne possède pas ce rôle
    dans le fournisseur d'identité, alors iel sera retiré·e de ce groupe.
  oauth_only_login: Connexion avec OAuth uniquement
  oauth_only_login_info: |
    Si activé, les utilisateur·trices seront redirigé immédiatement vers le fournisseur OAuth, esquivant complètement la page de connexion habituelle.
    Cependant, vous pouvez forcer l'accès à la page de connexion usuelle en ajoutant le paramètre `nosso` dans l'URL, ex. '/login?nosso'.
  identify_user_by: Identifier l'utilisateur·trice par
  identify_user_by_info: Le champ du fournisseur à utiliser pour identifier l'utilisateur·trice dans Redmine

